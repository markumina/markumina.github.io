<svg xmlns="http://www.w3.org/2000/svg" width="200" height="165" viewBox="0 0 200 165" shape-rendering="crispEdges">
  <!-- The original shop sign: old painted wood, made to fit the bracket in the scene. -->
  <path d="M31 34h138l6 6v60l-7 9H32l-7-9V41z" fill="#2b1917" stroke="#100e12" stroke-width="6"/>
  <path d="M35 41h130l3 3v52l-4 6H36l-4-6V45z" fill="#5a3027" stroke="#9b5d36" stroke-width="2"/>
  <path d="M39 47h122M38 96h124" fill="none" stroke="#c07a43" stroke-width="2" opacity="0.55"/>
  <circle cx="42" cy="49" r="2" fill="#d4a15c"/>
  <circle cx="158" cy="49" r="2" fill="#d4a15c"/>

  <text x="100" y="82" text-anchor="middle" fill="#f4d39a" stroke="#251512" stroke-width="1" paint-order="stroke"
        font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="24" font-weight="800">Pie Piper</text>

  <!-- A quick Halloween alteration painted over only the second word. -->
  <g fill="none" stroke="#ba352c" stroke-linecap="square">
    <path d="M91 88l72-24" stroke-width="4"/>
    <path d="M94 91l68-25" stroke="#e05a3c" stroke-width="1"/>
  </g>

  <!-- A crooked scrap of wood was nailed over the crossed-out second word. -->
  <g transform="rotate(-9 156 77)">
    <path d="M113 58l78 3 5 30-82 4-5-7 3-23z" fill="#bb8148" stroke="#211617" stroke-width="5"/>
    <path d="M118 66q16-4 34 0t36-1M118 83q20 5 38-1t33 2" fill="none" stroke="#7d4e2d" stroke-width="2" opacity="0.8"/>
    <path d="M130 62q-3 13 1 26M174 63q4 12-1 24" fill="none" stroke="#d29a5c" stroke-width="1" opacity="0.75"/>
    <circle cx="119" cy="67" r="3" fill="#33241e"/>
    <circle cx="189" cy="83" r="3" fill="#33241e"/>
    <text x="119" y="82" fill="#35231c" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="11" font-weight="800">to</text>
    <text x="136" y="83" fill="#a51f25" stroke="#5a171b" stroke-width="0.8" paint-order="stroke"
          font-family="'Arial Black', 'Trebuchet MS', Arial, sans-serif" font-size="16" font-weight="900">DIE</text>
    <text x="169" y="82" fill="#35231c" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="11" font-weight="800">for</text>
  </g>
</svg>
