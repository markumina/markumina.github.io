<svg xmlns="http://www.w3.org/2000/svg" width="200" height="165" viewBox="0 0 200 165" shape-rendering="crispEdges">
  <!-- The original shop sign: old painted wood, made to fit the bracket in the scene. -->
  <path d="M31 34h138l6 6v60l-7 9H32l-7-9V41z" fill="#2b1917" stroke="#100e12" stroke-width="6"/>
  <path d="M35 41h130l3 3v52l-4 6H36l-4-6V45z" fill="#5a3027" stroke="#9b5d36" stroke-width="2"/>
  <path d="M39 47h122M38 96h124" fill="none" stroke="#c07a43" stroke-width="2" opacity="0.55"/>
  <circle cx="42" cy="49" r="2" fill="#d4a15c"/>
  <circle cx="158" cy="49" r="2" fill="#d4a15c"/>

  <text x="42" y="82" fill="#f4d39a" stroke="#251512" stroke-width="1" paint-order="stroke"
        font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Pie</text>
  <text x="88" y="82" fill="#f4d39a" stroke="#251512" stroke-width="1" paint-order="stroke"
        font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">Piper</text>

  <!-- A quick Halloween alteration painted over only the second word. -->
  <g fill="none" stroke="#ba352c" stroke-linecap="square">
    <path d="M84 77l78 11" stroke-width="4"/>
    <path d="M88 80l71 10" stroke="#e05a3c" stroke-width="1"/>
  </g>

  <!-- Two short chains hold the added board below the original sign. -->
  <g fill="none" stroke="#151519" stroke-width="4">
    <path d="M57 108v22"/>
    <path d="M143 108v22"/>
  </g>
  <g fill="none" stroke="#8c6842" stroke-width="1">
    <path d="M58 109v20"/>
    <path d="M144 109v20"/>
  </g>

  <g transform="rotate(1 100 145)">
    <path d="M35 126h130l5 5v26l-5 5H35l-5-5v-26z" fill="#d6a05b" stroke="#211617" stroke-width="5"/>
    <path d="M39 132h122v23H39z" fill="none" stroke="#8d582f" stroke-width="2"/>
    <circle cx="42" cy="134" r="2" fill="#4a3227"/>
    <circle cx="158" cy="134" r="2" fill="#4a3227"/>
    <text x="43" y="153" fill="#3d251d" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="700">to</text>
    <g fill="none" stroke="#a51f25" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
