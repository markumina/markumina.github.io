    </g>
    <text x="136" y="153" fill="#3d251d" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="700">for</text>
    <path d="M70 158l53-3M130 134l8 3" fill="none" stroke="#b62b2d" stroke-width="1.5" opacity="0.72"/>
